apiVersion: network.hamid-cni.io/v1alpha1
kind: VPC
metadata:
  name: vpc-blue
spec:
  cidr: 10.0.0.0/16
  vxlanID: 100
  gateway: 10.0.0.1
---
apiVersion: network.hamid-cni.io/v1alpha1
kind: VPC
metadata:
  name: vpc-red
spec:
  # Intentionally overlaps with vpc-blue; isolated by VXLAN VNI 200.
  cidr: 10.0.0.0/16
  vxlanID: 200
  gateway: 10.0.0.1
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
  annotations:
    network.hamid-cni.io/vpc: vpc-blue
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-b
  annotations:
    network.hamid-cni.io/vpc: vpc-red
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: team-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: netshoot
          image: nicolaka/netshoot
          command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: team-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: netshoot
          image: nicolaka/netshoot
          command: ["sleep", "infinity"]
