name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  IMAGE_NAME: emamihe/hamid-cni

jobs:
  docker:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must look like v1.2.3 (got ${TAG})"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Publish Helm chart to GitHub Pages
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pages_url=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Collect existing charts from gh-pages
        run: |
          mkdir -p .helm-pages
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git archive origin/gh-pages | tar -x -C .helm-pages
            # Drop anything that is not a chart artifact / index.
            find .helm-pages -mindepth 1 -maxdepth 1 \
              ! -name '*.tgz' ! -name 'index.yaml' \
              -exec rm -rf {} +
          fi

      - name: Package chart
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          CHART_DIR="deploy/helm/hamid-cni"

          sed -i "s/^version: .*/version: ${VERSION}/" "${CHART_DIR}/Chart.yaml"
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" "${CHART_DIR}/Chart.yaml"
          sed -i "s|^  repository: .*|  repository: ${IMAGE_NAME}|" "${CHART_DIR}/values.yaml"
          sed -i "s|^  tag: .*|  tag: \"${VERSION}\"|" "${CHART_DIR}/values.yaml"

          helm package "${CHART_DIR}" \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination .helm-pages

      - name: Generate Helm repo index
        run: |
          PAGES_URL="${{ steps.meta.outputs.pages_url }}"
          if [ -f .helm-pages/index.yaml ]; then
            helm repo index .helm-pages --url "${PAGES_URL}" --merge .helm-pages/index.yaml
          else
            helm repo index .helm-pages --url "${PAGES_URL}"
          fi

          {
            echo "# hamid-cni Helm repository"
            echo
            echo '```bash'
            echo "helm repo add hamid-cni ${PAGES_URL}"
            echo "helm repo update"
            echo "helm install hamid-cni hamid-cni/hamid-cni --namespace kube-system"
            echo '```'
          } > .helm-pages/README.md

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .helm-pages
          publish_branch: gh-pages
          force_orphan: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
