{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "hamid-cni.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hamid-cni.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "hamid-cni.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "hamid-cni.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "hamid-cni.serviceAccountName" . }}
      hostNetwork: true
      hostPID: true
      priorityClassName: system-node-critical
      tolerations:
        {{- toYaml .Values.agent.tolerations | nindent 8 }}
      initContainers:
        - name: install-cni
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p {{ .Values.cni.binDir }} {{ .Values.cni.confDir }}
              cp -f /usr/local/bin/hamid-cni {{ .Values.cni.binDir }}/hamid-cni
              # loopback (and friends) are required by containerd/CRI / conflist chaining
              for bin in loopback portmap bandwidth host-local; do
                if [ -f "/opt/cni/bin/${bin}" ]; then
                  cp -f "/opt/cni/bin/${bin}" "{{ .Values.cni.binDir }}/${bin}"
                  chmod 755 "{{ .Values.cni.binDir }}/${bin}"
                fi
              done
              chmod 755 {{ .Values.cni.binDir }}/hamid-cni
              # Prefer hamid-cni as the primary conflist; remove stale 10-* configs that conflict.
              cp -f /cni/{{ .Values.cni.confName }} {{ .Values.cni.confDir }}/{{ .Values.cni.confName }}
          volumeMounts:
            - name: cni-bin
              mountPath: {{ .Values.cni.binDir }}
            - name: cni-conf
              mountPath: {{ .Values.cni.confDir }}
            - name: cni-config
              mountPath: /cni
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/hamid-agent
          args:
            - --node-name=$(NODE_NAME)
            - --socket={{ .Values.cni.socketPath }}
            - --mtu={{ .Values.cni.mtu }}
            - --bridge-prefix={{ .Values.agent.bridgePrefix }}
            - --vxlan-prefix={{ .Values.agent.vxlanPrefix }}
            - --default-vpc={{ .Values.agent.defaultVPC | default .Values.defaultVPC.name | default "default" }}
            {{- if .Values.agent.underlayIface }}
            - --underlay-iface={{ .Values.agent.underlayIface }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: cni-bin
              mountPath: {{ .Values.cni.binDir }}
            - name: cni-conf
              mountPath: {{ .Values.cni.confDir }}
            - name: host-run
              mountPath: /var/run/hamid-cni
            - name: host-netns
              mountPath: /var/run/netns
              mountPropagation: HostToContainer
            - name: host-proc
              mountPath: /host/proc
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: cni-bin
          hostPath:
            path: {{ .Values.cni.binDir }}
            type: DirectoryOrCreate
        - name: cni-conf
          hostPath:
            path: {{ .Values.cni.confDir }}
            type: DirectoryOrCreate
        - name: cni-config
          configMap:
            name: {{ include "hamid-cni.fullname" . }}-cni
        - name: host-run
          hostPath:
            path: /var/run/hamid-cni
            type: DirectoryOrCreate
        - name: host-netns
          hostPath:
            path: /var/run/netns
        - name: host-proc
          hostPath:
            path: /proc
        - name: lib-modules
          hostPath:
            path: /lib/modules
{{- end }}
